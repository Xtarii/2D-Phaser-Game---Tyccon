<!DOCTYPE html>
<html lang="en">
    <!-- Head -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Title -->
        <title>2D Tycoon: Home</title>

        <!-- Styles -->
         <link rel="stylesheet" href="../public/css/styles.css">
    </head>

    <!-- Body -->
    <body>
        <!-- Top Menu -->
        <nav>
            <div class="main">
                <a href="./index.html">Obesity Hotel</a>
            </div>
        </nav>



        <!-- Info -->
        <div class="left panel">
            <p>⑱ NSFW Content may be found</p>

            <p>
                We do not take responsibility for
                your actions in our game and we are
                not responsible if you are harassed
                by other players or feel that the game
                content is offending you.
            </p>
            <p>
                It is up to you to play this game or not.
            </p>
        </div>



        <!-- Game -->
        <div class="container">
            <input type="text" id="name" placeholder="Player Name" maxlength="15">
            <input type="text" id="spriteID" placeholder="Sprite ID">
            <button id="player:singleplayer">Play</button>


            <!-- Multiplayer -->
            <form id="multiplayer">
                <input type="text" id="server" placeholder="<IP>:<Port>">
                <button id="connect">Connect</button>
            </form>
        </div>





        <!-- Late Script Import -->
        <script type="module" src="../public/js/menu.js"></script>
    </body>
</html>
